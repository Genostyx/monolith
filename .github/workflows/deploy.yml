# Publishes the game to GitHub Pages on every push to main.
#
# The site is served from a SUBPATH (/monolith/). Every asset reference in
# dist/index.html is already relative, so nothing needs rewriting here - but
# keep it that way: a leading "/" would resolve against the domain root and
# 404 once deployed.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # So a deploy can be re-run from the Actions tab without an empty commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes one still building.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The ledger invariant tests. A broken A = L + E never reaches the site.
      - run: npm test

      # `enablement: true` switches Pages on for the repo the first time this
      # runs, so the site needs no manual toggle in repository settings.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
